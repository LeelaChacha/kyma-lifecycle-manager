<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" width="780" height="340"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
     text-rendering="geometricPrecision">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c7a75"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b0491c"/>
    </marker>
    <marker id="arrowPrimary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="780" height="340" fill="#fbfbf9"/>

  <!-- column headers -->
  <text x="110" y="28" font-size="10" font-weight="700" fill="#898781" text-anchor="middle" letter-spacing="0.06em">CRDs</text>
  <text x="430" y="28" font-size="10" font-weight="700" fill="#898781" text-anchor="middle" letter-spacing="0.06em">RECONCILERS</text>
  <text x="390" y="28" font-size="10" font-weight="700" fill="#898781" text-anchor="middle" letter-spacing="0.06em"></text>

  <!-- ── CRD: Watcher (legacy) ── translate(20, 48) w=180 h=60 -->
  <g transform="translate(20,48)">
    <rect width="180" height="60" rx="8" fill="#fdf6f3" stroke="#c97a5a" stroke-width="1.5" stroke-dasharray="5 3"/>
    <rect x="44" y="9" width="92" height="14" rx="7" fill="#c97a5a"/>
    <text x="90" y="20" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.04em">CRD (LEGACY)</text>
    <text x="90" y="42" font-size="12" font-weight="600" fill="#7a3111" text-anchor="middle">Watcher</text>
  </g>

  <!-- ── CRD: RuntimeWatcher ── translate(20, 172) w=180 h=60 -->
  <g transform="translate(20,172)">
    <rect width="180" height="60" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
    <rect x="44" y="9" width="92" height="14" rx="7" fill="#2a78d6"/>
    <text x="90" y="20" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.04em">CRD (CANONICAL)</text>
    <text x="90" y="42" font-size="12" font-weight="600" fill="#12385f" text-anchor="middle">RuntimeWatcher</text>
  </g>

  <!-- ── Reconciler: watcher (adapter) ── translate(330, 48) w=220 h=60 -->
  <g transform="translate(330,48)">
    <rect width="220" height="60" rx="8" fill="#fdf6f3" stroke="#c97a5a" stroke-width="1.5" stroke-dasharray="5 3"/>
    <rect x="52" y="9" width="116" height="14" rx="7" fill="#c97a5a"/>
    <text x="110" y="20" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.04em">ADAPTER RECONCILER</text>
    <text x="110" y="40" font-size="11" font-weight="600" fill="#7a3111" text-anchor="middle">controller/watcher/</text>
    <text x="110" y="54" font-size="9" font-weight="400" fill="#a05030" text-anchor="middle">removed when Watcher CRD is dropped</text>
  </g>

  <!-- ── Reconciler: runtimewatcher (primary) ── translate(330, 172) w=220 h=60 -->
  <g transform="translate(330,172)">
    <rect width="220" height="60" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
    <rect x="52" y="9" width="116" height="14" rx="7" fill="#2a78d6"/>
    <text x="110" y="20" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.04em">PRIMARY RECONCILER</text>
    <text x="110" y="42" font-size="11" font-weight="600" fill="#12385f" text-anchor="middle">controller/runtimewatcher/</text>
  </g>

  <!-- ── Service ── translate(240, 262) w=220 h=60 -->
  <g transform="translate(240,262)">
    <rect width="220" height="60" rx="8" fill="#e6f6f0" stroke="#1baf7a" stroke-width="1.5"/>
    <rect x="52" y="9" width="116" height="14" rx="7" fill="#0f6b4b"/>
    <text x="110" y="20" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.04em">SERVICE</text>
    <text x="110" y="40" font-size="11" font-weight="600" fill="#0d5540" text-anchor="middle">SkrWebhookManifestManager</text>
    <text x="110" y="54" font-size="9" font-weight="400" fill="#1b7a56" text-anchor="middle">takes *v1beta2.Kyma, not Watcher</text>
  </g>

  <!-- Edge: Watcher CR -> WatcherReconciler (watches) -->
  <path d="M200,78 H330" fill="none" stroke="#c97a5a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowDash)"/>
  <text x="265" y="70" font-size="9.5" font-weight="500" text-anchor="middle" fill="#a05030">watches</text>

  <!-- Edge: RuntimeWatcher CR -> RuntimeWatcherReconciler (watches) -->
  <path d="M200,202 H330" fill="none" stroke="#2a78d6" stroke-width="1.5" marker-end="url(#arrowPrimary)"/>
  <text x="265" y="194" font-size="9.5" font-weight="500" text-anchor="middle" fill="#2a78d6">watches</text>

  <!-- Edge: WatcherReconciler -> converts (dashed internal arrow down to RuntimeWatcherReconciler level) -->
  <path d="M440,108 V148 H390 V172" fill="none" stroke="#c97a5a" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arrowDash)"/>
  <text x="418" y="144" font-size="9" font-weight="500" text-anchor="middle" fill="#a05030">converts spec</text>
  <text x="418" y="155" font-size="9" font-weight="500" text-anchor="middle" fill="#a05030">in-memory</text>

  <!-- Edge: WatcherReconciler -> Service -->
  <path d="M440,108 V240 Q440,262 420,262" fill="none" stroke="#c97a5a" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrowDash)"/>

  <!-- Edge: RuntimeWatcherReconciler -> Service -->
  <path d="M440,232 V262" fill="none" stroke="#2a78d6" stroke-width="1.5" marker-end="url(#arrowPrimary)"/>
  <text x="460" y="252" font-size="9.5" font-weight="500" text-anchor="start" fill="#2a78d6">delegates</text>
</svg>